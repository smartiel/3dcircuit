<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Circuit Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #toolbar h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e94560;
      margin-right: auto;
    }

    #file-input {
      display: none;
    }

    #load-btn {
      cursor: pointer;
      padding: 6px 14px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    #load-btn:hover { background: #c73652; }

    #status {
      font-size: 0.8rem;
      color: #aaa;
    }

    .sep {
      color: #0f3460;
      font-size: 1.1rem;
      user-select: none;
    }

    .circuit-btn {
      cursor: pointer;
      padding: 6px 14px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a5276;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .circuit-btn:hover:not(:disabled) { background: #1a5276; }
    .circuit-btn:disabled { opacity: 0.4; cursor: default; }

    #build-btn { background: #1a6e42; border-color: #1a6e42; }
    #build-btn:hover:not(:disabled) { background: #1e8a52; }

    #canvas-container {
      flex: 1;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #555;
      pointer-events: none;
    }

    /* ── Settings panel ───────────────────────────────────────────────────── */
    #settings-panel {
      position: absolute;
      top: 0; right: 0;
      width: 220px;
      height: 100%;
      background: rgba(18, 28, 54, 0.97);
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      z-index: 10;
      font-size: 0.78rem;
    }
    #settings-panel.hidden { display: none; }

    #settings-panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e94560;
    }
    #settings-panel header button {
      background: none; border: none; color: #666;
      cursor: pointer; font-size: 0.95rem; line-height: 1;
      padding: 2px 4px;
    }
    #settings-panel header button:hover { color: #fff; }

    #settings-body {
      overflow-y: auto;
      flex: 1;
      padding: 10px 12px;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }

    .s-section { margin-bottom: 16px; }
    .s-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #e94560;
      margin-bottom: 8px;
    }

    /* slider rows */
    .s-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 7px; color: #ccc;
    }
    .s-row > span:first-child { width: 76px; flex-shrink: 0; }
    .s-row input[type=range] {
      flex: 1; accent-color: #e94560;
      cursor: pointer;
    }
    .s-row .val {
      width: 30px; text-align: right; color: #888;
      font-variant-numeric: tabular-nums;
    }

    /* color rows */
    .c-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 5px; color: #ccc;
    }
    .c-row > span { flex: 1; }
    .c-row input[type=color] {
      width: 34px; height: 18px;
      border: 1px solid #333; border-radius: 3px;
      cursor: pointer; padding: 1px 2px; background: none;
      flex-shrink: 0;
    }
    .c-row input[type=checkbox] {
      width: 14px; height: 14px; flex-shrink: 0;
      cursor: pointer; accent-color: #e94560;
    }

    /* camera coordinate rows */
    .cam-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr 1fr;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
      color: #ccc;
    }
    .cam-row > span { color: #888; font-size: 0.7rem; }
    .cam-row input[type=number] {
      width: 100%; min-width: 0;
      background: #0d1b2a; color: #ccc;
      border: 1px solid #333; border-radius: 3px;
      padding: 2px 4px; font-size: 0.72rem;
      text-align: right; box-sizing: border-box;
    }
    .cam-reset-btn {
      width: 100%; margin-top: 4px; padding: 4px 0;
      background: #0f3460; color: #ccc; border: 1px solid #1a4a80;
      border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    }
    .cam-reset-btn:hover { background: #1a4a80; color: #fff; }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>3D Circuit Viewer</h1>
    <span id="status">No file loaded</span>
    <button id="load-btn" onclick="document.getElementById('file-input').click()">Open .ply file</button>
    <input type="file" id="file-input" accept=".ply" />
    <span class="sep">│</span>
    <button class="circuit-btn" id="open-qasm-btn">Open .qasm</button>
    <input type="file" id="qasm-input" accept=".qasm,.openqasm" style="display:none" />
    <button class="circuit-btn" id="open-layout-btn">Open layout (optional)</button>
    <input type="file" id="layout-input" accept=".txt,.csv" style="display:none" />
    <button class="circuit-btn" id="build-btn" disabled>Build 3D circuit</button>
    <button class="circuit-btn" id="example-btn">Load example</button>
    <button class="circuit-btn" id="png-btn" disabled>Export PNG</button>
    <button class="circuit-btn" id="gif-btn" disabled>Export 360° GIF</button>
    <span class="sep">│</span>
    <button class="circuit-btn" id="settings-toggle-btn">⚙ Settings</button>
  </div>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    <div id="hint">Left-drag: rotate &nbsp;|&nbsp; Right-drag / scroll: zoom &nbsp;|&nbsp; Middle-drag: pan</div>
    <div id="settings-panel" class="hidden">
      <header>Settings <button id="settings-close-btn" title="Close">✕</button></header>
      <div id="settings-body"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ── Scene setup ──────────────────────────────────────────────────────────
    const canvas    = document.getElementById('canvas');
    const container = document.getElementById('canvas-container');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const scene  = new THREE.Scene();
    let bgColor   = '#1a1a2e';
    let bgOpacity = 1.0;
    renderer.setClearColor(bgColor, bgOpacity);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    camera.position.set(0, 0, 3);

    // ── Lights ───────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x8080ff, 0.4);
    fillLight.position.set(-5, -5, -5);
    scene.add(fillLight);

    // ── Controls ─────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;

    // ── Rotation pivot ───────────────────────────────────────────────────────
    const rotationPivot = new THREE.Group();
    scene.add(rotationPivot);

    let autoRotate = false;
    let rotSpeed   = 0.5; // rad/s
    let cameraInitialized = false;

    const clock = new THREE.Clock();

    // ── Resize handling ──────────────────────────────────────────────────────
    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Animation loop ───────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (autoRotate) rotationPivot.rotation.z += rotSpeed * delta;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ── PLY loading ──────────────────────────────────────────────────────────
    let currentMesh = null;
    let currentLabels = [];
    let showLabels       = true;
    let showWires        = true;
    let fancyControlled  = true;
    let wireOpacity    = 1.0;
    let pauliAsWire    = false;
    let pauliWireColor = [100, 220, 80];
    const hiddenGateKeys = new Set();

    function clearLabels() {
      for (const s of currentLabels) {
        rotationPivot.remove(s);
        s.material.map?.dispose();
        s.material.dispose();
      }
      currentLabels = [];
    }

    function makeTextSprite(text) {
      const W = 128, H = 64;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      let fs = 52;
      ctx.font = `bold ${fs}px sans-serif`;
      while (ctx.measureText(text).width > W * 0.88 && fs > 8) {
        fs -= 2;
        ctx.font = `bold ${fs}px sans-serif`;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#fff';
      ctx.fillText(text, W / 2, H / 2);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
      return new THREE.Sprite(mat);
    }

    function disposeObject3D(obj) {
      if (!obj) return;
      rotationPivot.remove(obj);
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          (Array.isArray(child.material) ? child.material : [child.material])
            .forEach(m => m.dispose());
        }
      });
    }

    function loadGeometry(geometry, sideView = false) {
      clearLabels();
      disposeObject3D(currentMesh);

      geometry.computeVertexNormals();

      // Use vertex colors if present, otherwise a flat material.
      const hasColors = geometry.hasAttribute('color');
      const material = new THREE.MeshStandardMaterial({
        vertexColors: hasColors,
        color: hasColors ? 0xffffff : 0x5599dd,
        roughness: 0.6,
        metalness: 0.1,
      });

      currentMesh = new THREE.Mesh(geometry, material);
      currentMesh.castShadow = true;
      currentMesh.receiveShadow = true;

      // Centre and normalise scale.
      geometry.computeBoundingBox();
      const box    = geometry.boundingBox;
      const centre = new THREE.Vector3();
      box.getCenter(centre);
      const size   = box.getSize(new THREE.Vector3()).length();

      // Translate vertices so the bbox centre sits at the mesh origin,
      // then scale uniformly — both transforms now pivot around (0,0,0).
      geometry.translate(-centre.x, -centre.y, -centre.z);
      currentMesh.scale.setScalar(2 / size);

      rotationPivot.add(currentMesh);
      document.getElementById('gif-btn').disabled = false;
      document.getElementById('png-btn').disabled = false;

      // Reset camera.
      // sideView: camera on the -X axis → time (Z) runs left-to-right,
      //           qubits (Y) run bottom-to-top.
      camera.position.set(sideView ? -3 : 0, 0, sideView ? 0 : 3);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      status.textContent = `Loading ${file.name}…`;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const loader = new PLYLoader();
        try {
          const geometry = loader.parse(ev.target.result);
          loadGeometry(geometry);
          status.textContent = file.name;
        } catch (err) {
          status.textContent = 'Error loading file';
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);

      // Allow re-selecting the same file.
      e.target.value = '';
    });

    // ── Circuit builder ──────────────────────────────────────────────────────
    // Layout file format (one qubit per line):  q[0] 0.0 0.0
    // QASM qubit names must match layout names exactly.

    // Mutable — updated live by the settings panel.
    const gateColors = {
      h:   [100, 160, 255], cx:  [255,  80,  80], cy:  [255, 100,  50],
      cz:  [255, 140,  50], x:   [255, 200,  80], y:   [200, 255,  80],
      z:   [ 80, 255, 160], t:   [ 80, 220, 120], tdg: [ 60, 180, 100],
      s:   [140, 220, 100], sdg: [110, 190,  90], sx:  [255, 170,  60], sxdg:[220, 130,  45],
      rx:  [190, 100, 255],
      ry:  [200, 120, 255], rz:  [220, 140, 255], u:   [160, 100, 220],
      u1:  [160, 100, 220], u2:  [160, 100, 220], u3:  [160, 100, 220],
      ccx: [220,  50,  50], swap:[255, 210,  50],
      other: [160, 160, 160],
    };

    const geo = { timeStep: 1.2, gateDepth: 0.85, margin: 0.35, wireRadius: 0.04 };
    const wireColor = [180, 180, 210];

    function gateColor(name) {
      return gateColors[name.toLowerCase()] ?? gateColors.other;
    }
    function resolveGateKey(name) {
      const k = name.toLowerCase();
      return (k in gateColors) ? k : 'other';
    }

    function parseLayout(text) {
      const layout = {};
      for (const line of text.split('\n')) {
        const t = line.trim();
        if (!t || t.startsWith('#')) continue;
        const parts = t.split(/\s+/);
        if (parts.length >= 3)
          layout[parts[0]] = [parseFloat(parts[1]), parseFloat(parts[2])];
      }
      return layout;
    }

    function parseQASM(text) {
      const gates = [];
      const SKIP = ['openqasm','include','qreg','creg','barrier','measure','reset','if'];
      for (let line of text.split('\n')) {
        line = line.trim().replace(/\/\/.*$/, '');
        if (!line || SKIP.some(kw => line.toLowerCase().startsWith(kw))) continue;
        // gate_name[(params)] qubit, qubit, ...;
        const m = line.match(/^([a-zA-Z_]\w*)(?:\([^)]*\))?\s+(.+);$/);
        if (!m) continue;
        const qubits = [];
        for (const part of m[2].split(',')) {
          const qm = part.trim().match(/(\w+)\[(\d+)\]/);
          if (qm) qubits.push(`${qm[1]}[${qm[2]}]`);
        }
        if (qubits.length) gates.push({ name: m[1], qubits });
      }
      return gates;
    }

    function scheduleGates(gates) {
      const nextFree = {};
      return gates.map(gate => {
        let t = 0;
        for (const q of gate.qubits) t = Math.max(t, nextFree[q] ?? 0);
        for (const q of gate.qubits) nextFree[q] = t + 1;
        return { ...gate, t };
      });
    }

    // Extract ordered qubit names from qreg declarations; fall back to gate order.
    function extractQubits(text) {
      const qubits = [];
      for (const line of text.split('\n')) {
        const m = line.trim().match(/^qreg\s+(\w+)\[(\d+)\]/i);
        if (m) {
          const [, name, count] = m;
          for (let i = 0; i < +count; i++) qubits.push(`${name}[${i}]`);
        }
      }
      if (!qubits.length) {
        const seen = new Set();
        for (const g of parseQASM(text))
          for (const q of g.qubits) if (!seen.has(q)) { seen.add(q); qubits.push(q); }
      }
      return qubits;
    }

    // Place n qubits on a circle; radius ensures adjacent gate shapes don't overlap.
    function circularLayout(qubits) {
      const n = qubits.length;
      if (n === 0) return {};
      if (n === 1) return { [qubits[0]]: [0, 0] };
      const R = (geo.margin * 1.5) / Math.sin(Math.PI / n);
      const layout = {};
      for (let i = 0; i < n; i++) {
        const a = (2 * Math.PI * i / n) - Math.PI / 2;
        layout[qubits[i]] = [R * Math.cos(a), R * Math.sin(a)];
      }
      return layout;
    }


    // ── Circuit UI state ─────────────────────────────────────────────────────
    let qasmText = null, layoutText = null;

    function updateBuildBtn() {
      document.getElementById('build-btn').disabled = !qasmText;
    }

    function buildCircuit() {
      const status = document.getElementById('status');
      try {
        const gates  = parseQASM(qasmText);
        const layout = layoutText
          ? parseLayout(layoutText)
          : circularLayout(extractQubits(qasmText));
        const sched  = scheduleGates(gates);

        // Build a Group of rounded-box meshes — one per gate.
        const group    = new THREE.Group();
        const centres  = [];   // local-space gate centres for sprite placement

        for (const gate of sched) {
          const positions = gate.qubits.map(q => layout[q]).filter(Boolean);
          if (!positions.length) continue;
          if (pauliAsWire && ['x','y','z'].includes(gate.name.toLowerCase())) continue;

          const z0    = gate.t * geo.timeStep;
          const z1    = z0 + geo.gateDepth;
          const zMid  = (z0 + z1) / 2;
          const depth = z1 - z0;
          const gKey  = resolveGateKey(gate.name);
          const vis   = !hiddenGateKeys.has(gKey);
          const [r, g, b] = gateColor(gate.name);
          const color = new THREE.Color(r / 255, g / 255, b / 255);

          const isControlled = fancyControlled
                                && ['cx','cy','cz'].includes(gate.name.toLowerCase())
                                && positions.length >= 2;

          if (isControlled) {
            const ctrlPos = positions[0];
            const tgtPos  = positions[1];
            const mkMat   = () => new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.18 });
            const add     = mesh => { mesh.userData.gateKey = gKey; mesh.visible = vis; mesh.castShadow = true; group.add(mesh); };

            // ── Control dot ──────────────────────────────────────────────
            const dotR    = geo.margin * 0.5;
            const dotMesh = new THREE.Mesh(new THREE.SphereGeometry(dotR, 14, 10), mkMat());
            dotMesh.position.set(ctrlPos[0], ctrlPos[1], zMid);
            add(dotMesh);

            // ── Stem ─────────────────────────────────────────────────────
            const dx = tgtPos[0] - ctrlPos[0];
            const dy = tgtPos[1] - ctrlPos[1];
            const stemLen = Math.hypot(dx, dy);
            if (stemLen > 1e-3) {
              const stemMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(geo.margin * 0.1, geo.margin * 0.1, stemLen, 8),
                mkMat()
              );
              stemMesh.position.set((ctrlPos[0]+tgtPos[0])/2, (ctrlPos[1]+tgtPos[1])/2, zMid);
              stemMesh.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx, dy, 0).normalize()
              );
              add(stemMesh);
            }

            // ── Target ───────────────────────────────────────────────────
            if (gate.name.toLowerCase() === 'cx') {
              // ⊕  ring + two cross bars, all in the YZ plane
              const ringR = geo.margin * 0.88;
              const tubeR = geo.margin * 0.14;

              const torusGeom = new THREE.TorusGeometry(ringR, tubeR, 8, 24);
              torusGeom.rotateY(Math.PI / 2);  // bring into YZ plane
              const torusMesh = new THREE.Mesh(torusGeom, mkMat());
              torusMesh.position.set(tgtPos[0], tgtPos[1], zMid);
              add(torusMesh);

              // Bar along the ctrl→tgt direction
              const bar1 = new THREE.Mesh(
                new THREE.CylinderGeometry(tubeR, tubeR, ringR * 2, 8), mkMat()
              );
              bar1.position.set(tgtPos[0], tgtPos[1], zMid);
              if (stemLen > 1e-3)
                bar1.quaternion.setFromUnitVectors(
                  new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx, dy, 0).normalize()
                );
              add(bar1);

              // Bar along Z (time axis)
              const bar2Geom = new THREE.CylinderGeometry(tubeR, tubeR, ringR * 2, 8);
              bar2Geom.rotateX(Math.PI / 2);
              const bar2 = new THREE.Mesh(bar2Geom, mkMat());
              bar2.position.set(tgtPos[0], tgtPos[1], zMid);
              add(bar2);

            } else {
              // CY / CZ: small labeled box on target qubit
              const bw = geo.margin * 2, bh = geo.margin * 2;
              const bRadius = Math.min(bw, bh, depth) * 0.18;
              const tgtMesh = new THREE.Mesh(new RoundedBoxGeometry(bw, bh, depth, 4, bRadius), mkMat());
              tgtMesh.position.set(tgtPos[0], tgtPos[1], zMid);
              add(tgtMesh);
            }

            centres.push({ gate, cx: (ctrlPos[0]+tgtPos[0])/2, cy: (ctrlPos[1]+tgtPos[1])/2, cz: zMid });

          } else {
            // ── Standard box spanning all qubits ─────────────────────────
            const xs = positions.map(p => p[0]);
            const ys = positions.map(p => p[1]);
            const x0 = Math.min(...xs) - geo.margin, x1 = Math.max(...xs) + geo.margin;
            const y0 = Math.min(...ys) - geo.margin, y1 = Math.max(...ys) + geo.margin;
            const w = x1 - x0, h = y1 - y0, d = depth;

            const radius = Math.min(w, h, d) * 0.18;
            const mesh   = new THREE.Mesh(
              new RoundedBoxGeometry(w, h, d, 4, radius),
              new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.18 })
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.set((x0+x1)/2, (y0+y1)/2, zMid);
            mesh.userData.gateKey = gKey;
            mesh.visible = vis;
            group.add(mesh);
            centres.push({ gate, cx: mesh.position.x, cy: mesh.position.y, cz: mesh.position.z });
          }
        }

        // Qubit wires — built as segments so Pauli positions can be coloured.
        if (sched.length > 0) {
          const maxT   = Math.max(...sched.map(g => g.t));
          const zStart = -geo.margin;
          const zEnd   = maxT * geo.timeStep + geo.gateDepth + geo.margin;

          const mkMat = (rgb, r) => new THREE.MeshStandardMaterial({
            color: new THREE.Color(rgb[0]/255, rgb[1]/255, rgb[2]/255),
            roughness: 0.5, metalness: 0.1,
            transparent: wireOpacity < 1, opacity: wireOpacity,
          });
          const addSeg = (pos, z0, z1, isPauli) => {
            const len = z1 - z0;
            if (len <= 1e-6) return;
            const r   = isPauli ? geo.wireRadius * 2 : geo.wireRadius;
            const mat = mkMat(isPauli ? pauliWireColor : wireColor);
            const g2  = new THREE.CylinderGeometry(r, r, len, 8);
            g2.rotateX(Math.PI / 2);
            const m   = new THREE.Mesh(g2, mat);
            m.position.set(pos[0], pos[1], z0 + len / 2);
            m.userData.isWire = true;
            m.visible = showWires;
            group.add(m);
          };

          const usedQubits = [...new Set(sched.flatMap(g => g.qubits))];
          for (const qname of usedQubits) {
            const pos = layout[qname];
            if (!pos) continue;

            if (pauliAsWire) {
              // Collect Pauli gate z-ranges on this qubit, sorted by time.
              const pauliSegs = sched
                .filter(g => ['x','y','z'].includes(g.name.toLowerCase()) && g.qubits.includes(qname))
                .map(g => [g.t * geo.timeStep, g.t * geo.timeStep + geo.gateDepth])
                .sort((a, b) => a[0] - b[0]);

              let cur = zStart;
              for (const [pz0, pz1] of pauliSegs) {
                addSeg(pos, cur, pz0, false);
                addSeg(pos, pz0, pz1, true);
                cur = pz1;
              }
              addSeg(pos, cur, zEnd, false);
            } else {
              addSeg(pos, zStart, zEnd, false);
            }
          }
        }

        // Normalise the group to fit in a 2-unit sphere centred at origin.
        // Shift every child so the bbox centre lands at the group's local origin,
        // then scale the group — both transforms now pivot around (0,0,0).
        const bbox = new THREE.Box3().setFromObject(group);
        const normCentre = bbox.getCenter(new THREE.Vector3());
        const normScale  = 2 / bbox.getSize(new THREE.Vector3()).length();
        for (const child of group.children) child.position.sub(normCentre);
        group.scale.setScalar(normScale);

        clearLabels();
        disposeObject3D(currentMesh);
        currentMesh = group;
        rotationPivot.add(group);

        // Only set default camera on first build; preserve position on rebuilds.
        if (!cameraInitialized) {
          camera.position.set(-3, 0, 0);
          controls.target.set(0, 0, 0);
          controls.update();
          cameraInitialized = true;
        }

        // Text sprites — world pos = normScale * (localPos − normCentre)
        const labelW = normScale * geo.gateDepth * 0.72;
        const labelH = labelW * 0.5;
        for (const { gate, cx, cy, cz } of centres) {
          const sprite = makeTextSprite(gate.name.toUpperCase());
          sprite.position.set(
            normScale * (cx - normCentre.x),
            normScale * (cy - normCentre.y),
            normScale * (cz - normCentre.z),
          );
          sprite.scale.set(labelW, labelH, 1);
          sprite.userData.gateKey = resolveGateKey(gate.name);
          sprite.visible = showLabels && !hiddenGateKeys.has(sprite.userData.gateKey);
          rotationPivot.add(sprite);
          currentLabels.push(sprite);
        }

        const depth = sched.length ? Math.max(...sched.map(g => g.t)) + 1 : 0;
        const layoutNote = layoutText ? '' : ' · circular layout';
        status.textContent = `${gates.length} gates · depth ${depth}${layoutNote}`;
        document.getElementById('gif-btn').disabled = false;
        document.getElementById('png-btn').disabled = false;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        console.error(err);
      }
    }

    // ── Inline GIF encoder (no external dependencies) ───────────────────────
    function encodeGIF(frames, w, h, delayMs) {
      let buf = new Uint8Array(1 << 21); let pos = 0;
      const grow = n => { if (pos + n > buf.length) { const b = new Uint8Array(buf.length * 2); b.set(buf); buf = b; } };
      const wr  = v   => { grow(1); buf[pos++] = v & 255; };
      const w2  = v   => { grow(2); buf[pos++] = v & 255; buf[pos++] = (v >> 8) & 255; };
      const wb  = arr => { grow(arr.length); buf.set(arr, pos); pos += arr.length; };

      // LZW-GIF encode (minCodeSize = 8, so CLEAR=256, EOI=257)
      function lzw(idx) {
        const bits = []; let ob = 0, ol = 0, cs = 9, nc = 258;
        const tab = new Map();
        const emit = c => { ob |= c << ol; ol += cs; while (ol >= 8) { bits.push(ob & 255); ob >>>= 8; ol -= 8; } };
        const reset = () => { tab.clear(); cs = 9; nc = 258; };
        emit(256);
        let p = idx[0];
        for (let i = 1; i < idx.length; i++) {
          const k = idx[i], key = (p << 8) | k, e = tab.get(key);
          if (e !== undefined) { p = e; continue; }
          emit(p);
          if (nc < 4096) { tab.set(key, nc++); if (nc > 1 << cs) cs++; }
          else { emit(256); reset(); }
          p = k;
        }
        emit(p); emit(257);
        if (ol) bits.push(ob & 255);
        return bits;
      }

      // Median-cut quantiser → 256-colour palette + per-pixel indices
      function quantise(rgba) {
        const n = w * h;
        const rgb = new Uint8Array(n * 3);
        for (let i = 0; i < n; i++) { rgb[i*3]=rgba[i*4]; rgb[i*3+1]=rgba[i*4+1]; rgb[i*3+2]=rgba[i*4+2]; }
        const ord = Uint32Array.from({length: n}, (_, i) => i);
        const pal = [];
        function cut(lo, hi, depth) {
          if (hi <= lo) return;
          if (depth === 0 || hi - lo === 1) {
            let r=0,g=0,b=0;
            for (let i=lo;i<hi;i++){const x=ord[i]*3;r+=rgb[x];g+=rgb[x+1];b+=rgb[x+2];}
            const c=hi-lo; pal.push([r/c|0,g/c|0,b/c|0]); return;
          }
          let r0=255,r1=0,g0=255,g1=0,b0=255,b1=0;
          for (let i=lo;i<hi;i++){const x=ord[i]*3,r=rgb[x],g=rgb[x+1],b=rgb[x+2];
            if(r<r0)r0=r;if(r>r1)r1=r;if(g<g0)g0=g;if(g>g1)g1=g;if(b<b0)b0=b;if(b>b1)b1=b;}
          const ch=(r1-r0>=g1-g0&&r1-r0>=b1-b0)?0:(g1-g0>=b1-b0)?1:2;
          ord.subarray(lo,hi).sort((a,b)=>rgb[a*3+ch]-rgb[b*3+ch]);
          const m=(lo+hi)>>1; cut(lo,m,depth-1); cut(m,hi,depth-1);
        }
        cut(0, n, 8);
        while (pal.length < 256) pal.push([0,0,0]);
        // LUT for fast nearest-colour lookup (5-bit per channel → 32768 slots)
        const lut = new Int16Array(32768).fill(-1);
        const near = (r,g,b) => {
          const k=(r>>3)*1024+(g>>3)*32+(b>>3);
          if (lut[k]>=0) return lut[k];
          let best=0,bd=Infinity;
          for (let j=0;j<256;j++){const dr=r-pal[j][0],dg=g-pal[j][1],db=b-pal[j][2];const d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=j;}}
          return lut[k]=best;
        };
        const palette=new Uint8Array(768), idx=new Uint8Array(n);
        for (let i=0;i<n;i++) idx[i]=near(rgb[i*3],rgb[i*3+1],rgb[i*3+2]);
        for (let i=0;i<256;i++){palette[i*3]=pal[i][0];palette[i*3+1]=pal[i][1];palette[i*3+2]=pal[i][2];}
        return {palette,idx};
      }

      // GIF89a header + Netscape loop-forever extension
      wb(new Uint8Array([71,73,70,56,57,97])); w2(w); w2(h);
      wb(new Uint8Array([0,0,0]));
      wb(new Uint8Array([0x21,0xff,0x0b,78,69,84,83,67,65,80,69,50,46,48,3,1,0,0,0]));

      for (const rgba of frames) {
        const {palette,idx} = quantise(rgba);
        // Graphic Control Extension
        wb(new Uint8Array([0x21,0xf9,4,0])); w2(delayMs/10|0); wb(new Uint8Array([0,0]));
        // Image Descriptor + local colour table (256 entries)
        wr(0x2c); w2(0); w2(0); w2(w); w2(h); wr(0x87); wb(palette);
        // LZW image data split into ≤255-byte sub-blocks
        const bits = lzw(idx); wr(8);
        for (let i=0;i<bits.length;){const n=Math.min(255,bits.length-i);wr(n);wb(new Uint8Array(bits.slice(i,i+n)));i+=n;}
        wr(0);
      }
      wr(0x3b);
      return buf.slice(0, pos);
    }

    async function generateGif() {
      if (!currentMesh) return;

      const GIF_SIZE = 400;
      const FRAMES   = 36;   // one frame every 10°
      const DELAY    = 80;   // ms per frame (~12.5 fps)

      const gifBtn = document.getElementById('gif-btn');
      gifBtn.disabled = true;

      const savedRotY       = rotationPivot.rotation.y;
      const savedAutoRotate = autoRotate;
      autoRotate = false;

      renderer.setSize(GIF_SIZE, GIF_SIZE);
      camera.aspect = 1;
      camera.updateProjectionMatrix();

      const gl     = renderer.getContext();
      const rawPx  = new Uint8Array(GIF_SIZE * GIF_SIZE * 4);
      const stride = GIF_SIZE * 4;
      const frames = [];

      for (let i = 0; i < FRAMES; i++) {
        gifBtn.textContent = `Capturing… ${i + 1} / ${FRAMES}`;
        rotationPivot.rotation.z = (i / FRAMES) * Math.PI * 2;
        renderer.render(scene, camera);
        gl.readPixels(0, 0, GIF_SIZE, GIF_SIZE, gl.RGBA, gl.UNSIGNED_BYTE, rawPx);
        // Flip vertically (WebGL origin is bottom-left)
        const frame = new Uint8Array(GIF_SIZE * GIF_SIZE * 4);
        for (let row = 0; row < GIF_SIZE; row++)
          frame.set(rawPx.subarray((GIF_SIZE-1-row)*stride, (GIF_SIZE-row)*stride), row*stride);
        frames.push(frame);
        await new Promise(r => setTimeout(r, 0));
      }

      gifBtn.textContent = 'Encoding…';
      await new Promise(r => setTimeout(r, 0));

      const gifBytes = encodeGIF(frames, GIF_SIZE, GIF_SIZE, DELAY);
      const blob = new Blob([gifBytes], { type: 'image/gif' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = 'circuit_360.gif';
      a.click();
      URL.revokeObjectURL(url);

      rotationPivot.rotation.z = savedRotY;
      autoRotate = savedAutoRotate;
      resize();

      gifBtn.textContent = 'Export 360° GIF';
      gifBtn.disabled = false;
    }

    function exportPng() {
      if (!currentMesh) return;
      // Render synchronously right before grabbing pixels — the WebGL
      // drawing buffer is cleared between animation frames otherwise.
      renderer.render(scene, camera);
      canvas.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'circuit.png';
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

      const allKeys = [key, ...extra];

        rebuildIfActive();
      });
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = true;
      chk.title = 'Show / hide';
      chk.addEventListener('change', () => {
        for (const k of allKeys) {
          if (chk.checked) hiddenGateKeys.delete(k); else hiddenGateKeys.add(k);
        }
        if (currentMesh instanceof THREE.Group) {
          for (const child of currentMesh.children) {
            if (allKeys.includes(child.userData.gateKey))
              child.visible = chk.checked;
          }
        }
        for (const s of currentLabels) {
          if (allKeys.includes(s.userData.gateKey))
            s.visible = chk.checked && showLabels;
        }
      });
      row.append(lbl, inp, chk);
      return row;
    }

      animChkRow.className = 'c-row';
      const animChkLbl = document.createElement('span');
      animChkLbl.textContent = 'Auto-rotate';
      const animChk = document.createElement('input');
      animChk.type = 'checkbox';
      animChk.checked = false;
      animChk.title = 'Enable / disable rotation';
      animChk.addEventListener('change', () => { autoRotate = animChk.checked; });
      animChkRow.append(animChkLbl, animChk);
      animSec.appendChild(animChkRow);

      const animSpeedRow = document.createElement('div');
      animSpeedRow.className = 's-row';
      const animSpeedLbl = document.createElement('span');
      animSpeedLbl.textContent = 'Speed';
      const animSpeedVal = document.createElement('span');
      animSpeedVal.className = 'val';
      animSpeedVal.textContent = rotSpeed.toFixed(2);
      const animSpeedInp = document.createElement('input');
      animSpeedInp.type = 'range';
      animSpeedInp.min = 0.05; animSpeedInp.max = 3.0; animSpeedInp.step = 0.05;
      animSpeedInp.value = rotSpeed;
      animSpeedInp.addEventListener('input', () => {
        rotSpeed = parseFloat(animSpeedInp.value);
        animSpeedVal.textContent = rotSpeed.toFixed(2);
      });
      animSpeedRow.append(animSpeedLbl, animSpeedInp, animSpeedVal);
      animSec.appendChild(animSpeedRow);

      body.appendChild(animSec);

      // Camera section
      const camSec = document.createElement('div');
      camSec.className = 's-section';
      camSec.innerHTML = '<div class="s-label">Camera</div>';

      const CAM_DECIMALS = 3;
      const fmt = v => v.toFixed(CAM_DECIMALS);
      const parse = s => { const v = parseFloat(s); return isNaN(v) ? 0 : v; };

      function makeCamRow(label, getters, setters) {
        const row = document.createElement('div');
        row.className = 'cam-row';
        const lbl = document.createElement('span');
        lbl.textContent = label;
        row.appendChild(lbl);
        const inps = getters.map((get, i) => {
          const inp = document.createElement('input');
          inp.type = 'number'; inp.step = '0.01';
          inp.value = fmt(get());
          inp.addEventListener('change', () => {
            setters[i](parse(inp.value));
            controls.update();
          });
          row.appendChild(inp);
          return inp;
        });
        return { row, inps };
      }

      const { row: posRow, inps: posInps } = makeCamRow(
        'Pos',
        [() => camera.position.x, () => camera.position.y, () => camera.position.z],
        [v => { camera.position.x = v; }, v => { camera.position.y = v; }, v => { camera.position.z = v; }]
      );
      const { row: tgtRow, inps: tgtInps } = makeCamRow(
        'Target',
        [() => controls.target.x, () => controls.target.y, () => controls.target.z],
        [v => { controls.target.x = v; }, v => { controls.target.y = v; }, v => { controls.target.z = v; }]
      );

      // Sync inputs whenever the camera moves (OrbitControls fires 'change')
      controls.addEventListener('change', () => {
        [camera.position.x, camera.position.y, camera.position.z].forEach((v, i) => {
          if (document.activeElement !== posInps[i]) posInps[i].value = fmt(v);
        });
        [controls.target.x, controls.target.y, controls.target.z].forEach((v, i) => {
          if (document.activeElement !== tgtInps[i]) tgtInps[i].value = fmt(v);
        });
      });

      const camResetBtn = document.createElement('button');
      camResetBtn.textContent = 'Reset camera';
      camResetBtn.className = 'cam-reset-btn';
      camResetBtn.addEventListener('click', () => {
        camera.position.set(-3, 0, 0);
        controls.target.set(0, 0, 0);
        controls.update();
      });

      camSec.append(posRow, tgtRow, camResetBtn);
      body.appendChild(camSec);

      const colSec = document.createElement('div');
      colSec.className = 's-section';
      colSec.innerHTML = '<div class="s-label">Gate Colors</div>';

      // Master "all gates" checkbox
      const allRow = document.createElement('div');
      allRow.className = 'c-row';
      const allLbl = document.createElement('span');
      allLbl.textContent = 'All gates';
      const allChk = document.createElement('input');
      allChk.type = 'checkbox';
      allChk.checked = true;
      allChk.title = 'Show / hide all';
      allRow.append(allLbl, allChk);
      colSec.appendChild(allRow);

      for (const [label, key, extra] of PANEL_GATES)
        colSec.appendChild(makeColorRow(label, key, extra));

      // Wire master checkbox to all gate checkboxes
      const gateChks = Array.from(colSec.querySelectorAll('input[type=checkbox]')).slice(1);

      function updateAllChk() {
        const n = gateChks.filter(c => c.checked).length;
        allChk.indeterminate = n > 0 && n < gateChks.length;
        allChk.checked = n === gateChks.length;
      }

      allChk.addEventListener('change', () => {
        for (const c of gateChks)
          if (c.checked !== allChk.checked) c.click();
      });

      for (const c of gateChks) c.addEventListener('change', updateAllChk);

      body.appendChild(colSec);

      // Toggle open/close
      const panel = document.getElementById('settings-panel');
      document.getElementById('settings-toggle-btn').addEventListener('click', () =>
        panel.classList.toggle('hidden'));
      document.getElementById('settings-close-btn').addEventListener('click', () =>
        panel.classList.add('hidden'));
    })();

    // ── Jupyter embed auto-build hook ────────────────────────────────────────
    if (window.__CIRCUIT_DATA__) {
      const _d = window.__CIRCUIT_DATA__;
      if (_d.qasm)   { document.getElementById('qasm-input').value   = _d.qasm;   qasmText   = _d.qasm; }
      if (_d.layout) { document.getElementById('layout-input').value = _d.layout; layoutText = _d.layout; }
      updateBuildBtn();
      buildCircuit();
    }
  </script>
</body>
</html>
