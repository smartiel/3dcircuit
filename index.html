<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Circuit Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #toolbar h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e94560;
      margin-right: auto;
    }

    #file-input {
      display: none;
    }

    #load-btn {
      cursor: pointer;
      padding: 6px 14px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    #load-btn:hover { background: #c73652; }

    #status {
      font-size: 0.8rem;
      color: #aaa;
    }

    .sep {
      color: #0f3460;
      font-size: 1.1rem;
      user-select: none;
    }

    .circuit-btn {
      cursor: pointer;
      padding: 6px 14px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a5276;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .circuit-btn:hover:not(:disabled) { background: #1a5276; }
    .circuit-btn:disabled { opacity: 0.4; cursor: default; }

    #build-btn { background: #1a6e42; border-color: #1a6e42; }
    #build-btn:hover:not(:disabled) { background: #1e8a52; }

    #canvas-container {
      flex: 1;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #555;
      pointer-events: none;
    }

    /* ── Settings panel ───────────────────────────────────────────────────── */
    #settings-panel {
      position: absolute;
      top: 0; right: 0;
      width: 220px;
      height: 100%;
      background: rgba(18, 28, 54, 0.97);
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      z-index: 10;
      font-size: 0.78rem;
    }
    #settings-panel.hidden { display: none; }

    #settings-panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e94560;
    }
    #settings-panel header button {
      background: none; border: none; color: #666;
      cursor: pointer; font-size: 0.95rem; line-height: 1;
      padding: 2px 4px;
    }
    #settings-panel header button:hover { color: #fff; }

    #settings-body {
      overflow-y: auto;
      flex: 1;
      padding: 10px 12px;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }

    .s-section { margin-bottom: 16px; }
    .s-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #e94560;
      margin-bottom: 8px;
    }

    /* slider rows */
    .s-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 7px; color: #ccc;
    }
    .s-row > span:first-child { width: 76px; flex-shrink: 0; }
    .s-row input[type=range] {
      flex: 1; accent-color: #e94560;
      cursor: pointer;
    }
    .s-row .val {
      width: 30px; text-align: right; color: #888;
      font-variant-numeric: tabular-nums;
    }

    /* color rows */
    .c-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 5px; color: #ccc;
    }
    .c-row > span { flex: 1; }
    .c-row input[type=color] {
      width: 34px; height: 18px;
      border: 1px solid #333; border-radius: 3px;
      cursor: pointer; padding: 1px 2px; background: none;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>3D Circuit Viewer</h1>
    <span id="status">No file loaded</span>
    <button id="load-btn" onclick="document.getElementById('file-input').click()">Open .ply file</button>
    <input type="file" id="file-input" accept=".ply" />
    <span class="sep">│</span>
    <button class="circuit-btn" id="open-qasm-btn">Open .qasm</button>
    <input type="file" id="qasm-input" accept=".qasm,.openqasm" style="display:none" />
    <button class="circuit-btn" id="open-layout-btn">Open layout</button>
    <input type="file" id="layout-input" accept=".txt,.csv" style="display:none" />
    <button class="circuit-btn" id="build-btn" disabled>Build 3D circuit</button>
    <button class="circuit-btn" id="example-btn">Load example</button>
    <span class="sep">│</span>
    <button class="circuit-btn" id="settings-toggle-btn">⚙ Settings</button>
  </div>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    <div id="hint">Left-drag: rotate &nbsp;|&nbsp; Right-drag / scroll: zoom &nbsp;|&nbsp; Middle-drag: pan</div>
    <div id="settings-panel" class="hidden">
      <header>Settings <button id="settings-close-btn" title="Close">✕</button></header>
      <div id="settings-body"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    // ── Scene setup ──────────────────────────────────────────────────────────
    const canvas    = document.getElementById('canvas');
    const container = document.getElementById('canvas-container');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const scene  = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    camera.position.set(0, 0, 3);

    // ── Lights ───────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x8080ff, 0.4);
    fillLight.position.set(-5, -5, -5);
    scene.add(fillLight);

    // ── Controls ─────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;

    // ── Resize handling ──────────────────────────────────────────────────────
    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Animation loop ───────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ── PLY loading ──────────────────────────────────────────────────────────
    let currentMesh = null;
    let currentLabels = [];

    function clearLabels() {
      for (const s of currentLabels) {
        scene.remove(s);
        s.material.map?.dispose();
        s.material.dispose();
      }
      currentLabels = [];
    }

    function makeTextSprite(text) {
      const W = 128, H = 64;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      let fs = 52;
      ctx.font = `bold ${fs}px sans-serif`;
      while (ctx.measureText(text).width > W * 0.88 && fs > 8) {
        fs -= 2;
        ctx.font = `bold ${fs}px sans-serif`;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#fff';
      ctx.fillText(text, W / 2, H / 2);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
      return new THREE.Sprite(mat);
    }

    function loadGeometry(geometry, sideView = false) {
      clearLabels();
      if (currentMesh) {
        scene.remove(currentMesh);
        currentMesh.geometry.dispose();
        currentMesh.material.dispose();
      }

      geometry.computeVertexNormals();

      // Use vertex colors if present, otherwise a flat material.
      const hasColors = geometry.hasAttribute('color');
      const material = new THREE.MeshStandardMaterial({
        vertexColors: hasColors,
        color: hasColors ? 0xffffff : 0x5599dd,
        roughness: 0.6,
        metalness: 0.1,
      });

      currentMesh = new THREE.Mesh(geometry, material);
      currentMesh.castShadow = true;
      currentMesh.receiveShadow = true;

      // Centre and normalise scale.
      geometry.computeBoundingBox();
      const box    = geometry.boundingBox;
      const centre = new THREE.Vector3();
      box.getCenter(centre);
      const size   = box.getSize(new THREE.Vector3()).length();

      currentMesh.position.sub(centre);
      const scale = 2 / size;
      currentMesh.scale.setScalar(scale);

      scene.add(currentMesh);

      // Reset camera.
      // sideView: camera on the -X axis → time (Z) runs left-to-right,
      //           qubits (Y) run bottom-to-top.
      camera.position.set(sideView ? -3 : 0, 0, sideView ? 0 : 3);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      status.textContent = `Loading ${file.name}…`;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const loader = new PLYLoader();
        try {
          const geometry = loader.parse(ev.target.result);
          loadGeometry(geometry);
          status.textContent = file.name;
        } catch (err) {
          status.textContent = 'Error loading file';
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);

      // Allow re-selecting the same file.
      e.target.value = '';
    });

    // ── Circuit builder ──────────────────────────────────────────────────────
    // Layout file format (one qubit per line):  q[0] 0.0 0.0
    // QASM qubit names must match layout names exactly.

    // Mutable — updated live by the settings panel.
    const gateColors = {
      h:   [100, 160, 255], cx:  [255,  80,  80], cy:  [255, 100,  50],
      cz:  [255, 140,  50], x:   [255, 200,  80], y:   [200, 255,  80],
      z:   [ 80, 255, 160], t:   [ 80, 220, 120], tdg: [ 60, 180, 100],
      s:   [140, 220, 100], sdg: [110, 190,  90], rx:  [190, 100, 255],
      ry:  [200, 120, 255], rz:  [220, 140, 255], u:   [160, 100, 220],
      u1:  [160, 100, 220], u2:  [160, 100, 220], u3:  [160, 100, 220],
      ccx: [220,  50,  50], swap:[255, 210,  50],
      other: [160, 160, 160],
    };

    const geo = { timeStep: 1.2, gateDepth: 0.85, margin: 0.35 };

    function gateColor(name) {
      return gateColors[name.toLowerCase()] ?? gateColors.other;
    }

    function parseLayout(text) {
      const layout = {};
      for (const line of text.split('\n')) {
        const t = line.trim();
        if (!t || t.startsWith('#')) continue;
        const parts = t.split(/\s+/);
        if (parts.length >= 3)
          layout[parts[0]] = [parseFloat(parts[1]), parseFloat(parts[2])];
      }
      return layout;
    }

    function parseQASM(text) {
      const gates = [];
      const SKIP = ['openqasm','include','qreg','creg','barrier','measure','reset','if'];
      for (let line of text.split('\n')) {
        line = line.trim().replace(/\/\/.*$/, '');
        if (!line || SKIP.some(kw => line.toLowerCase().startsWith(kw))) continue;
        // gate_name[(params)] qubit, qubit, ...;
        const m = line.match(/^([a-zA-Z_]\w*)(?:\([^)]*\))?\s+(.+);$/);
        if (!m) continue;
        const qubits = [];
        for (const part of m[2].split(',')) {
          const qm = part.trim().match(/(\w+)\[(\d+)\]/);
          if (qm) qubits.push(`${qm[1]}[${qm[2]}]`);
        }
        if (qubits.length) gates.push({ name: m[1], qubits });
      }
      return gates;
    }

    function scheduleGates(gates) {
      const nextFree = {};
      return gates.map(gate => {
        let t = 0;
        for (const q of gate.qubits) t = Math.max(t, nextFree[q] ?? 0);
        for (const q of gate.qubits) nextFree[q] = t + 1;
        return { ...gate, t };
      });
    }

    function buildCircuitPLY(scheduled, layout) {
      const TIME_STEP  = geo.timeStep;
      const GATE_DEPTH = geo.gateDepth;
      const MARGIN     = geo.margin;
      const vLines = [], fLines = [];
      let vo = 0;

      for (const gate of scheduled) {
        const positions = gate.qubits.map(q => layout[q]).filter(Boolean);
        if (!positions.length) continue;

        const xs = positions.map(p => p[0]);
        const ys = positions.map(p => p[1]);
        const x0 = Math.min(...xs) - MARGIN, x1 = Math.max(...xs) + MARGIN;
        const y0 = Math.min(...ys) - MARGIN, y1 = Math.max(...ys) + MARGIN;
        const z0 = gate.t * TIME_STEP,        z1 = z0 + GATE_DEPTH;
        const [r, g, b] = gateColor(gate.name);

        for (const [x, y, z] of [
          [x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
          [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],
        ]) vLines.push(`${x} ${y} ${z} ${r} ${g} ${b}`);

        // CCW-wound triangles for each of the 6 faces
        const o = vo;
        for (const [a, b, c] of [
          [o+0,o+3,o+2],[o+0,o+2,o+1],  // -z
          [o+4,o+5,o+6],[o+4,o+6,o+7],  // +z
          [o+0,o+1,o+5],[o+0,o+5,o+4],  // -y
          [o+3,o+7,o+6],[o+3,o+6,o+2],  // +y
          [o+0,o+4,o+7],[o+0,o+7,o+3],  // -x
          [o+1,o+2,o+6],[o+1,o+6,o+5],  // +x
        ]) fLines.push(`3 ${a} ${b} ${c}`);
        vo += 8;
      }

      return [
        'ply', 'format ascii 1.0',
        `element vertex ${vLines.length}`,
        'property float x', 'property float y', 'property float z',
        'property uchar red', 'property uchar green', 'property uchar blue',
        `element face ${fLines.length}`,
        'property list uchar int vertex_indices',
        'end_header',
        ...vLines, ...fLines,
      ].join('\n');
    }

    // ── Circuit UI state ─────────────────────────────────────────────────────
    let qasmText = null, layoutText = null;

    function updateBuildBtn() {
      document.getElementById('build-btn').disabled = !(qasmText && layoutText);
    }

    function buildCircuit() {
      const status = document.getElementById('status');
      try {
        const gates    = parseQASM(qasmText);
        const layout   = parseLayout(layoutText);
        const sched    = scheduleGates(gates);
        const ply      = buildCircuitPLY(sched, layout);
        const buf      = new TextEncoder().encode(ply).buffer;
        const geometry = new PLYLoader().parse(buf);

        // Capture normalisation params before loadGeometry transforms the mesh.
        geometry.computeBoundingBox();
        const normCentre = new THREE.Vector3();
        geometry.boundingBox.getCenter(normCentre);
        const normScale  = 2 / geometry.boundingBox.getSize(new THREE.Vector3()).length();

        loadGeometry(geometry, true);   // also calls clearLabels()

        // Place a text sprite at the centre of each gate brick.
        // World position: normScale * localPos − normCentre  (mesh transform formula)
        const labelW = normScale * geo.gateDepth * 0.72;
        const labelH = labelW * 0.5;

        for (const gate of sched) {
          const positions = gate.qubits.map(q => layout[q]).filter(Boolean);
          if (!positions.length) continue;
          const xs = positions.map(p => p[0]);
          const ys = positions.map(p => p[1]);
          const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
          const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
          const cz = gate.t * geo.timeStep + geo.gateDepth / 2;
          const sprite = makeTextSprite(gate.name.toUpperCase());
          sprite.position.set(
            normScale * cx - normCentre.x,
            normScale * cy - normCentre.y,
            normScale * cz - normCentre.z,
          );
          sprite.scale.set(labelW, labelH, 1);
          scene.add(sprite);
          currentLabels.push(sprite);
        }

        const depth = sched.length ? Math.max(...sched.map(g => g.t)) + 1 : 0;
        status.textContent = `${gates.length} gates · depth ${depth}`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        console.error(err);
      }
    }

    function rebuildIfActive() {
      if (qasmText && layoutText) buildCircuit();
    }

    document.getElementById('open-qasm-btn').addEventListener('click', () =>
      document.getElementById('qasm-input').click());

    document.getElementById('open-layout-btn').addEventListener('click', () =>
      document.getElementById('layout-input').click());

    document.getElementById('qasm-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => { qasmText = ev.target.result; updateBuildBtn(); };
      r.readAsText(file);
      document.getElementById('status').textContent = `QASM: ${file.name}`;
      e.target.value = '';
    });

    document.getElementById('layout-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => { layoutText = ev.target.result; updateBuildBtn(); };
      r.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('build-btn').addEventListener('click', buildCircuit);

    document.getElementById('example-btn').addEventListener('click', () => {
      qasmText = [
        'OPENQASM 2.0;',
        'include "qelib1.inc";',
        'qreg q[2];',
        'h q[0];',
        'cx q[0],q[1];',
      ].join('\n');
      layoutText = 'q[0] 0.0 0.0\nq[1] 0.0 1.0';
      updateBuildBtn();
      buildCircuit();
      document.getElementById('status').textContent = 'Example: H + CX (2 qubits)';
    });

    // ── Settings panel ───────────────────────────────────────────────────────
    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgbToHex([r, g, b]) {
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    // Each entry: [display label, primary key, [...aliased keys]]
    const PANEL_GATES = [
      ['H',        'h',    []],
      ['X',        'x',    []],
      ['Y',        'y',    []],
      ['Z',        'z',    []],
      ['S / S†',   's',    ['sdg']],
      ['T / T†',   't',    ['tdg']],
      ['Rx/Ry/Rz', 'rx',   ['ry', 'rz']],
      ['U',        'u',    ['u1', 'u2', 'u3']],
      ['CX',       'cx',   []],
      ['CY',       'cy',   []],
      ['CZ',       'cz',   []],
      ['SWAP',     'swap', []],
      ['CCX',      'ccx',  []],
      ['Other',    'other',[]],
    ];

    function makeSliderRow(label, key, min, max, step) {
      const row  = document.createElement('div');
      row.className = 's-row';
      const lbl  = document.createElement('span');
      lbl.textContent = label;
      const val  = document.createElement('span');
      val.className = 'val';
      val.textContent = geo[key].toFixed(2);
      const inp  = document.createElement('input');
      inp.type = 'range';
      inp.min = min; inp.max = max; inp.step = step;
      inp.value = geo[key];
      inp.addEventListener('input', () => {
        geo[key] = parseFloat(inp.value);
        val.textContent = geo[key].toFixed(2);
        rebuildIfActive();
      });
      row.append(lbl, inp, val);
      return row;
    }

    function makeColorRow(label, key, extra) {
      const row = document.createElement('div');
      row.className = 'c-row';
      const lbl = document.createElement('span');
      lbl.textContent = label;
      const inp = document.createElement('input');
      inp.type = 'color';
      inp.value = rgbToHex(gateColors[key]);
      inp.addEventListener('input', () => {
        const rgb = hexToRgb(inp.value);
        gateColors[key] = rgb;
        for (const k of extra) gateColors[k] = rgb;
        rebuildIfActive();
      });
      row.append(lbl, inp);
      return row;
    }

    (function initPanel() {
      const body = document.getElementById('settings-body');

      // Geometry section
      const geoSec = document.createElement('div');
      geoSec.className = 's-section';
      geoSec.innerHTML = '<div class="s-label">Geometry</div>';
      geoSec.append(
        makeSliderRow('Time step',  'timeStep',  0.5,  3.0,  0.05),
        makeSliderRow('Gate depth', 'gateDepth', 0.05, 1.15, 0.05),
        makeSliderRow('Margin',     'margin',    0.05, 0.8,  0.05),
      );
      body.appendChild(geoSec);

      // Gate colors section
      const colSec = document.createElement('div');
      colSec.className = 's-section';
      colSec.innerHTML = '<div class="s-label">Gate Colors</div>';
      for (const [label, key, extra] of PANEL_GATES)
        colSec.appendChild(makeColorRow(label, key, extra));
      body.appendChild(colSec);

      // Toggle open/close
      const panel = document.getElementById('settings-panel');
      document.getElementById('settings-toggle-btn').addEventListener('click', () =>
        panel.classList.toggle('hidden'));
      document.getElementById('settings-close-btn').addEventListener('click', () =>
        panel.classList.add('hidden'));
    })();
  </script>
</body>
</html>
